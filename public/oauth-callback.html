<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Impact Tracker - OAuth Callback</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }
      .container {
        text-align: center;
        padding: 2rem;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        backdrop-filter: blur(10px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top: 4px solid white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 1rem;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      h1 {
        margin: 0 0 1rem 0;
        font-size: 1.5rem;
      }
      p {
        margin: 0;
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="spinner"></div>
      <h1>Authenticating...</h1>
      <p>Please wait while we complete your login.</p>
    </div>

    <script>
      // This page handles the OAuth callback from Google
      // It will automatically close and notify the extension

      console.log("🔄 OAuth callback page loaded");

      // Check if we're in a popup window
      if (window.opener) {
        console.log("✅ In popup window, notifying parent");

        // Notify the parent window (extension) that auth was successful
        try {
          window.opener.postMessage(
            {
              type: "SUPABASE_AUTH_SUCCESS",
              timestamp: Date.now(),
            },
            "*"
          );

          // Close the popup after a short delay
          setTimeout(() => {
            window.close();
          }, 1000);
        } catch (error) {
          console.error("❌ Error notifying parent:", error);
          // Fallback: just close the popup
          setTimeout(() => {
            window.close();
          }, 2000);
        }
      } else {
        console.log("ℹ️ Not in popup, redirecting to extension");

        // If not in popup, try to redirect to the extension
        setTimeout(() => {
          try {
            // Try to redirect to the extension
            window.location.href =
              "chrome-extension://edcagboipniaohiafoialcmniojdcone/";
          } catch (error) {
            console.error("❌ Cannot redirect to extension:", error);
            // Show message to user
            document.querySelector(".container").innerHTML = `
                        <h1>✅ Authentication Complete!</h1>
                        <p>You can now close this window and return to your extension.</p>
                    `;
          }
        }, 2000);
      }
    </script>
  </body>
</html>
