<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Impact Tracker - OAuth Callback</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        /* background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); */
        /* color: white; */
      }
      .container {
        text-align: center;
        padding: 2rem;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        backdrop-filter: blur(10px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top: 4px solid white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 1rem;
      }
      .titleClasses {
        display: flex;
        font-size: 3xl;
        font-weight: light;
        letter-spacing: tight;
      }

      .superscriptClasses {
        margin-left: 0;
        margin-right: 2;
        font-weight: bold;
        color: #89af23;
      }

      .settingsButtonClasses {
        font-size: lg;
        display: flex;
        gap: 4;
      }

      .aiClasses {
        font-weight: bold;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      h1 {
        margin: 0 0 1rem 0;
        font-size: 1.5rem;
      }
      p {
        margin: 0;
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <h1 class="titleClasses">
      <!-- <Plant color="green" style={{ margin: "0px 2px" }} /> -->
      <span class="aiClasses">ai</span>
      <span class="superscriptClasses">m2Balance</span>
      <span class="aiClasses">.ai</span>
    </h1>
    <div class="container">
      <div class="spinner"></div>
      <h1>Authenticating...</h1>
      <p>Please wait while we complete your login.</p>
    </div>

    <script src="oauth-callback.js"></script>
  </body>
</html>
